    <meta property="og:title" content="تحلیل راهبردی اکوسیستم سرمایه انسانی اسپوتا | بسته ارائه به مدیریت ارشد" />
    <meta property="og:description" content="پلتفرم جامع تحلیل راهبردی و پرزنت مدیریتی طرح اکوسیستم سرمایه انسانی گروه صنعتی اسپوتا مخصوص ارائه به مدیریت ارشد" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <style>@keyframes spoota-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin src="./assets/index-pElFpvcp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D69Kgv5W.css">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Vazirmatn',system-ui,sans-serif]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; direction: rtl;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 44px; height: 44px; border: 4px solid #F07824; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: spoota-spin 0.8s linear infinite;"></div>
          <div style="font-weight: 800; font-size: 17px; letter-spacing: -0.5px;">گروه صنعتی اسپوتا (SPOOTA)</div>
          <div id="spoota-loader-msg" style="color: #94a3b8; font-size: 12px; margin-top: 6px;">در حال بارگذاری بسته تحلیلی مدیریت ارشد...</div>
          <div id="spoota-fallback-btn" style="display: none; margin-top: 16px;">
            <a href="./docs/" style="display: inline-block; background: #F07824; color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: bold;">
              ورود به نسخه نهایی سامانه (پوشه docs) ←
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var msg = document.getElementById('spoota-loader-msg');
        var btn = document.getElementById('spoota-fallback-btn');
        if (msg) {
          msg.innerHTML = 'در حال انتقال به نسخه کامپایل‌شده سامانه...';
          if (btn) btn.style.display = 'block';
          var path = window.location.pathname;
          if (!path.includes('/docs') && !path.includes('/dist')) {
            window.location.replace('./docs/');
          }
        }
      }, 2000);
    </script>
  </body>
</html>
