<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تحلیل راهبردی اکوسیستم سرمایه انسانی اسپوتا | بسته ارائه به مدیریت ارشد</title>
    <meta name="description" content="پلتفرم جامع تحلیل راهبردی و پرزنت مدیریتی طرح اکوسیستم سرمایه انسانی گروه صنعتی اسپوتا مخصوص ارائه به مدیریت ارشد" />
    <meta property="og:title" content="تحلیل راهبردی اکوسیستم سرمایه انسانی اسپوتا | بسته ارائه به مدیریت ارشد" />
    <meta property="og:description" content="پلتفرم جامع تحلیل راهبردی و پرزنت مدیریتی طرح اکوسیستم سرمایه انسانی گروه صنعتی اسپوتا مخصوص ارائه به مدیریت ارشد" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/app.css" onerror="this.remove()">
    <style>
      @keyframes spoota-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Vazirmatn',system-ui,sans-serif]">
    <div id="root"></div>

    <!-- Primary entry point for Vite development server -->
    <script type="module" src="./src/main.tsx"></script>

    <!-- Automatic loader fallback for static environments (e.g. GitHub Pages root hosting) -->
    <script>
      (function() {
        // If running statically on GitHub Pages where main.tsx is not compiled, load pre-bundled app.js
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            console.log('Spoota: Loading pre-compiled bundle from ./assets/app.js...');
            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/app.js';
            document.body.appendChild(script);
          }
        }, 400);
      })();
    </script>
  </body>
</html>
